<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Trunkline">
  <title>Trunkline</title>
  <!--
    Trunkline mark: a dominant vertical trunk bar (the "line") with thinner
    branches forking off to stacked worktree nodes. Trunk is a solid rounded
    bar so it reads clearly; branches are lighter and connect from the trunk's
    right edge. Theme-friendly greens.
  -->
  <defs>
    <linearGradient id="tl-trunk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#44d860" />
      <stop offset="1" stop-color="#277148" />
    </linearGradient>
  </defs>

  <!-- Dominant trunk: a rounded vertical bar -->
  <rect x="34" y="30" width="26" height="140" rx="13" fill="url(#tl-trunk)" />

  <!-- Branches fork from the trunk's right edge to stacked nodes -->
  <g stroke="#38a163" stroke-width="9" fill="none">
    <path d="M60 66 H118" />
    <path d="M60 100 H144" />
    <path d="M60 134 H118" />
  </g>

  <!-- Stacked branch (worktree) nodes -->
  <circle cx="128" cy="66" r="16" fill="#3cad6e" />
  <circle cx="154" cy="100" r="16" fill="#44d860" />
  <circle cx="128" cy="134" r="16" fill="#3cad6e" />

  <!-- Subtle highlights on the nodes -->
  <g fill="#ffffff" fill-opacity="0.30">
    <circle cx="122" cy="60" r="4.5" />
    <circle cx="148" cy="94" r="4.5" />
    <circle cx="122" cy="128" r="4.5" />
  </g>
</svg>
