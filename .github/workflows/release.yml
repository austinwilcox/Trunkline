name: Release

# Build cross-platform `tl` binaries and attach them to a GitHub Release
# whenever a version tag (v*) is pushed, e.g. `git tag v0.2.0 && git push --tags`.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.2.0). Used for manual runs."
        required: true

permissions:
  contents: write # needed to create the release and upload assets

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: linux
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            os: linux
            arch: aarch64
          - target: x86_64-apple-darwin
            os: macos
            arch: x86_64
          - target: aarch64-apple-darwin
            os: macos
            arch: aarch64
          - target: x86_64-pc-windows-msvc
            os: windows
            arch: x86_64
            ext: .exe
          - target: aarch64-pc-windows-msvc
            os: windows
            arch: aarch64
            ext: .exe
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Bake the tag's version into the binary so `tl --version` and the update
      # check report the released version.
      - name: Stamp version
        run: |
          printf 'export const VERSION = "%s";\n' "${{ steps.ver.outputs.version }}" > /tmp/ver.txt
          # Replace the VERSION line in src/version.ts.
          sed -i 's/^export const VERSION = .*/export const VERSION = "${{ steps.ver.outputs.version }}";/' src/version.ts
          grep '^export const VERSION' src/version.ts

      - name: Compile
        run: |
          mkdir -p dist
          deno compile -A --target ${{ matrix.target }} \
            -o "dist/tl${{ matrix.ext }}" src/main.ts

      - name: Package
        id: pkg
        run: |
          NAME="tl-${{ steps.ver.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}"
          cd dist
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip "../${NAME}.zip" "tl${{ matrix.ext }}"
            echo "asset=${NAME}.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "../${NAME}.tar.gz" "tl"
            echo "asset=${NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          fi
          cd ..
          sha256sum "${{ steps.pkg.outputs.asset || '' }}" 2>/dev/null || true

      - name: Checksum
        run: |
          sha256sum "${{ steps.pkg.outputs.asset }}" > "${{ steps.pkg.outputs.asset }}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.asset }}
          path: |
            ${{ steps.pkg.outputs.asset }}
            ${{ steps.pkg.outputs.asset }}.sha256

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256
